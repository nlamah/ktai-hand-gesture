<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title description">
  <title id="title">Schematische hand met MCP-, PIP-, DIP- en IP-gewrichten</title>
  <desc id="description">Een handpalm met de gewrichten van de wijsvinger en duim gemarkeerd. MCP zit bij de knokkel aan de handpalm, PIP is het middelste gewricht, DIP zit het dichtst bij de vingertop. De duim heeft MCP en IP.</desc>
  <defs>
    <style>
      .hand { fill: #f5c7a6; stroke: #563d32; stroke-width: 5; stroke-linejoin: round; }
      .bone { fill: none; stroke: #f5c7a6; stroke-width: 48; stroke-linecap: round; stroke-linejoin: round; }
      .outline { fill: none; stroke: #563d32; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .joint { fill: #fff3a6; stroke: #382d29; stroke-width: 4; }
      .leader { fill: none; stroke: #382d29; stroke-width: 3; }
      .label { font: 700 25px system-ui, sans-serif; fill: #202124; }
      .small { font: 20px system-ui, sans-serif; fill: #303134; }
      .heading { font: 700 31px system-ui, sans-serif; fill: #202124; }
    </style>
  </defs>

  <rect width="1000" height="680" rx="18" fill="#ffffff"/>
  <text x="42" y="52" class="heading">Gewrichten van de hand (schematisch)</text>
  <text x="42" y="84" class="small">De gele punten markeren gewrichten; iedere vinger heeft een MCP-knokkel.</text>

  <!-- Palm and fingers -->
  <path class="bone" d="M365 404 L329 351 L283 306 L249 270"/>
  <path class="bone" d="M382 350 L373 269 L366 184 L363 137"/>
  <path class="bone" d="M441 337 L441 245 L441 162 L441 111"/>
  <path class="bone" d="M500 342 L511 261 L520 190 L526 151"/>
  <path class="bone" d="M553 357 L579 291 L595 234 L604 204"/>
  <path class="hand" d="M335 386
    C340 351 361 325 387 311
    C404 301 411 278 413 250
    L414 155 C414 128 429 110 443 110
    C458 110 470 126 470 151
    L470 242 L481 170 C485 145 502 132 516 136
    C531 140 538 157 534 181
    L522 258 L539 201 C546 178 564 170 578 177
    C592 184 596 200 590 223
    L576 292 L591 251 C600 231 617 226 630 234
    C643 242 644 259 636 279
    L607 354 C598 378 590 399 592 424
    L602 536 L359 536 L368 450
    C369 426 355 409 335 386 Z"/>
  <path class="outline" d="M365 404 L329 351 L283 306 L249 270"/>
  <path class="outline" d="M382 350 L373 269 L366 184 L363 137"/>
  <path class="outline" d="M441 337 L441 245 L441 162 L441 111"/>
  <path class="outline" d="M500 342 L511 261 L520 190 L526 151"/>
  <path class="outline" d="M553 357 L579 291 L595 234 L604 204"/>
  <path class="outline" d="M373 449 C422 469 531 467 594 440"/>

  <!-- Thumb joints -->
  <circle class="joint" cx="329" cy="351" r="11"/>
  <circle class="joint" cx="283" cy="306" r="11"/>
  <!-- Index joints -->
  <circle class="joint" cx="382" cy="350" r="11"/>
  <circle class="joint" cx="373" cy="269" r="11"/>
  <circle class="joint" cx="366" cy="184" r="11"/>
  <!-- Other finger MCP joints -->
  <circle class="joint" cx="441" cy="337" r="11"/>
  <circle class="joint" cx="500" cy="342" r="11"/>
  <circle class="joint" cx="553" cy="357" r="11"/>

  <!-- Thumb labels -->
  <path class="leader" d="M329 351 L240 393 L62 393"/>
  <text x="62" y="383" class="label">Duim-MCP</text>
  <text x="62" y="419" class="small">knokkel bij de handpalm</text>
  <path class="leader" d="M283 306 L227 292 L62 292"/>
  <text x="62" y="282" class="label">Duim-IP</text>
  <text x="62" y="318" class="small">gewricht tussen de twee</text>
  <text x="62" y="344" class="small">duimkootjes</text>

  <!-- Index labels -->
  <path class="leader" d="M382 350 L660 350 L704 326"/>
  <text x="716" y="333" class="label">MCP</text>
  <text x="716" y="360" class="small">iedere vingerknokkel aan handpalm</text>
  <path class="leader" d="M373 269 L660 269 L704 247"/>
  <text x="716" y="254" class="label">PIP</text>
  <text x="716" y="281" class="small">middelste knokkel</text>
  <path class="leader" d="M366 184 L660 184 L704 166"/>
  <text x="716" y="173" class="label">DIP</text>
  <text x="716" y="200" class="small">knokkel dicht bij vingertop</text>

  <path d="M703 409 L703 480" stroke="#1b5e82" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="726" y="431" class="label">Vanaf de handpalm</text>
  <text x="726" y="466" class="small">MCP → PIP → DIP → vingertop</text>
  <text x="726" y="506" class="small">De andere vier vingers hebben</text>
  <text x="726" y="532" class="small">dezelfde MCP/PIP/DIP-volgorde.</text>

  <rect x="42" y="578" width="916" height="66" rx="12" fill="#f1f5f8"/>
  <text x="62" y="608" class="small">MCP = knokkel aan de handpalm · PIP = middelste gewricht · DIP = gewricht dicht bij de top</text>
  <text x="62" y="634" class="small">Duim: MCP en IP. IP is het gewricht dichter bij de duimtop.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1b5e82"/>
    </marker>
  </defs>
</svg>
